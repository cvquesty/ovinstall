name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shell:
    name: bash -n + shellcheck + --help
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          set -euo pipefail
          for f in bin/* lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: ShellCheck
        run: |
          set -euo pipefail
          # Severity warning: surface style issues without blocking forever on pedantic info
          shellcheck -S warning bin/* lib/*.sh

      - name: ovinstall --help (no root required)
        run: ./bin/ovinstall --help
